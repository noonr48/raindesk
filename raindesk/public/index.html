<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Raindesk — creative companion · After the Last Rain</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/workspace-accessibility.css">
<link rel="stylesheet" href="css/creative-desk.css">
<link rel="stylesheet" href="css/reference-board.css">
<link rel="stylesheet" href="css/surface-handoff.css">
<link rel="stylesheet" href="css/character-anchors.css">
<link rel="stylesheet" href="css/animatic-pacing.css">
<link rel="stylesheet" href="css/animatic-takes.css">
<link rel="stylesheet" href="css/freeform-desk.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="creativeWorld" class="creative-world" aria-label="creative desk world"></div>
  </div>

  <nav id="creativeTabs" class="creative-tabs" aria-label="creative canvases"></nav>

  <header class="topbar">
    <button id="laneChip" class="tb-btn" title="board lanes" aria-label="board lanes">◧</button>
    <div id="shotTitle" class="tb-title">raindesk</div>
    <button id="undoBtn" class="tb-btn" title="undo" aria-label="undo">↶</button>
  </header>

  <div id="hint" class="hint" aria-live="polite">board: … 👀</div>

  <button id="drawerHandle" class="drawer-handle" aria-label="open agent drawer">
    <i></i><i></i><i></i>
  </button>

  <nav class="toolbar">
    <button class="tool" data-tool="select" title="select / lasso"><span>≻</span><small>SELECT</small></button>
    <button class="tool active" data-tool="pen" title="pen"><span>✒️</span><small>PEN</small></button>
    <button class="tool" data-tool="direction" title="draw direction"><span>&#8605;</span><small>DIRECT</small></button>
    <button class="tool" data-tool="beats" title="micro beats"><span>&#8942;</span><small>BEATS</small></button>
    <button class="tool" data-tool="layers" title="layers"><span>≡</span><small>LAYERS</small></button>
  </nav>

  <div id="penpop" class="penpop">
    <div class="row">
      <button class="swatch on" data-color="#e07856" style="background:#e07856" aria-label="coral"></button>
      <button class="swatch" data-color="#e8b04b" style="background:#e8b04b" aria-label="gold"></button>
      <button class="swatch" data-color="#6f97a3" style="background:#6f97a3" aria-label="teal"></button>
      <button class="swatch" data-color="#f3ead8" style="background:#f3ead8" aria-label="cream"></button>
    </div>
    <div class="row">
      <input id="penWidth" type="range" min="1" max="24" step="1" value="4" aria-label="pen thickness">
      <span id="penDotSize" class="pen-dot"></span>
    </div>
  </div>

  <div id="takeChip" class="take-chip"></div>

  <div id="directionCaption" class="direction-caption" aria-hidden="true">
    <input id="directionCaptionInput" type="text" maxlength="500"
           placeholder="what does this movement / camera do?" autocomplete="off">
    <button id="directionCaptionSave" type="button">tell partner</button>
    <button id="directionCaptionCancel" class="direction-caption-cancel" type="button" aria-label="cancel">&times;</button>
  </div>

  <div class="genbar-wrap">
    <div id="dock" class="commit-dock">
      <button id="discardBtn" class="x-btn" title="discard take" aria-label="discard take">✕</button>
      <button id="prevTake" class="ghost-btn" title="previous take" aria-label="previous take">‹</button>
      <div id="takeLabel" class="take-label">take 1/1</div>
      <button id="nextTake" class="ghost-btn" title="next take" aria-label="next take">›</button>
      <button id="commitBtn" class="commit-btn">COMMIT → layer</button>
    </div>
    <div class="genbar">
      <input id="prompt" type="text" placeholder="describe the change… (optional)"
             autocomplete="off" maxlength="500">
      <button id="genBtn" class="gen-btn">GEN</button>
    </div>
  </div>

  <div id="beatTrail" aria-hidden="true"></div>

  <div id="scenesPanel" class="workspace-scenes-panel" aria-hidden="true">
    <div class="workspace-panel-head"><strong>Scenes</strong><button id="scenesClose" type="button" aria-label="close scenes">×</button></div>
    <div id="sceneRows" class="workspace-scene-rows"></div>
  </div>

  <nav id="panelShelf" class="workspace-panel-shelf" aria-label="workspace panels"></nav>

  <div id="layersPanel" class="panel">
    <h4 id="panelTitle">Layers</h4>
    <div id="layerRows"></div>
  </div>

  <div id="sheetScrim" class="sheet">
    <div class="sheet-card" role="dialog" aria-label="board lanes">
      <div class="sheet-head">
        <h4>Board · lanes</h4>
        <button id="sheetClose" class="tb-btn" aria-label="close">✕</button>
      </div>
      <div id="lanesList"></div>
    </div>
  </div>

  <div id="drawer"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>

<script src="js/canvas.js"></script>
<script src="js/api.js"></script>
<script src="js/animatic-api.js"></script>
<script src="js/character-api.js"></script>
<script src="js/sheet-sync.js"></script>
<script src="js/chat.js"></script>
<script src="js/animatic-pacing.js"></script>
<script src="js/animatic-takes.js"></script>
<script src="js/surface-handoff.js"></script>
<script src="js/direction.js"></script>
<script src="js/beats.js"></script>
<script src="js/workspace-ui.js"></script>
<script src="js/creative-desk.js"></script>
<script src="js/creative-sheets-gestures.js"></script>
<script src="js/reference-board.js"></script>
<script src="js/shot-context.js"></script>
<script src="js/character-anchors.js"></script>
<script src="js/v4-client.js"></script>
<script src="js/window-manager.js"></script>
<script src="js/freeform-surfaces.js"></script>
<script src="js/app.js"></script>
</body>
</html>

name: Fix Creative Sheets Title Gesture

on:
  push:
    branches:
      - 'chatgpt/creative-sheets-v1'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact title gesture ownership fix
        working-directory: raindesk
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('public/js/creative-desk.js')
          s = p.read_text()
          old = "if (e.button !== 0 || e.target.closest('button,input,textarea,[contenteditable=\"true\"]')) return;"
          new = "if (e.button !== 0 || e.target.closest('button,input,textarea,.creative-sheet-title,[contenteditable=\"true\"]')) return;"
          if s.count(old) != 1:
              raise SystemExit(f'expected one old drag selector, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/frontend/creative-sheets.test.js')
          s = p.read_text()
          marker = "test('Partner Creative Desk context is bounded to sheet summary rather than stroke point payloads', () => {\n"
          insert = """test('sheet title owns click and double-click gestures instead of starting a sheet drag', () => {\n  assert.match(source, /button,input,textarea,\\.creative-sheet-title,\\[contenteditable=\\\"true\\\"\\]/);\n  assert.match(source, /title\\.addEventListener\\('dblclick'/);\n});\n\n"""
          if insert in s:
              raise SystemExit('gesture regression test already present')
          if s.count(marker) != 1:
              raise SystemExit(f'expected one test insertion marker, found {s.count(marker)}')
          p.write_text(s.replace(marker, insert + marker, 1))
          PY
          node --check public/js/creative-desk.js
          node --test tests/frontend/creative-sheets.test.js
          npm test
      - name: Commit source and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/creative-sheets-title-gesture-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'raindesk: keep sheet title gestures out of header dragging'
          git push origin HEAD:chatgpt/creative-sheets-v1

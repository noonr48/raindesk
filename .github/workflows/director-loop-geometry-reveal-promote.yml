name: Promote Geometry-Based Beat Reveal

on:
  push:
    branches:
      - 'chatgpt/director-loop-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact geometry-based reveal transformation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('raindesk/public/js/beats.js')
          s = p.read_text()
          old = '''      if (activeBeatId) {\n        const row = list.querySelector(`.beat-row[data-beat-id="${activeBeatId}"]`);\n        if (row) {\n          // Establish selected-Beat visibility as part of the same render that\n          // publishes the row.  Do not defer this to requestAnimationFrame:\n          // callers should never observe a Beat in the DOM while its controls\n          // are still clipped waiting for a later paint.\n          const top = list.offsetTop + row.offsetTop;\n          const bottom = detail.classList.contains('open')\n            ? detail.offsetTop + detail.offsetHeight\n            : top + row.offsetHeight;\n          if (bottom - top <= body.clientHeight) {\n            if (top < body.scrollTop) body.scrollTop = top;\n            else if (bottom > body.scrollTop + body.clientHeight) {\n              body.scrollTop = Math.max(0, bottom - body.clientHeight);\n            }\n          } else {\n            body.scrollTop = Math.max(0, top);\n          }\n        }\n      }\n'''
          replacement = '''      if (activeBeatId) revealBeatRow(activeBeatId);\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one mixed-offset visibility block, found {s.count(old)}')
          s = s.replace(old, replacement)
          anchor = '''    function render(spec) {\n'''
          helper = '''    function revealBeatRow(beatId) {\n      if (!beatId) return false;\n      const row = list.querySelector(`.beat-row[data-beat-id="${beatId}"]`);\n      if (!row || typeof row.getBoundingClientRect !== 'function' ||\n          typeof body.getBoundingClientRect !== 'function') return false;\n\n      // Measure the geometry the artist actually sees instead of composing\n      // offsetTop values from different offset-parent chains.  The compact\n      // Beat row and its reorder/edit controls are the visibility contract;\n      // selected pose detail is allowed to continue below in a small panel.\n      const viewport = body.getBoundingClientRect();\n      const rect = row.getBoundingClientRect();\n      if (!(viewport.height > 0) || !(rect.height > 0)) return false;\n      const pad = 6;\n      const topEdge = viewport.top + pad;\n      const bottomEdge = viewport.bottom - pad;\n      if (rect.top < topEdge) {\n        body.scrollTop = Math.max(0, body.scrollTop - (topEdge - rect.top));\n      } else if (rect.bottom > bottomEdge) {\n        body.scrollTop = Math.max(0, body.scrollTop + (rect.bottom - bottomEdge));\n      }\n      return true;\n    }\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one render anchor, found {s.count(anchor)}')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)

          t = Path('raindesk/tests/frontend/beats.test.js')
          ts = t.read_text()
          marker = "test('selected Beat reveal uses visible geometry rather than mixed offset coordinates'"
          if marker not in ts:
              ts = ts.rstrip() + '''\n\ntest('selected Beat reveal uses visible geometry rather than mixed offset coordinates', () => {\n  assert.match(beatsSource, /function revealBeatRow\\(beatId\\)/);\n  assert.match(beatsSource, /body\\.getBoundingClientRect\\(\\)/);\n  assert.match(beatsSource, /row\\.getBoundingClientRect\\(\\)/);\n  assert.match(beatsSource, /if \\(activeBeatId\\) revealBeatRow\\(activeBeatId\\)/);\n  assert.doesNotMatch(beatsSource, /const top = list\\.offsetTop \\+ row\\.offsetTop/);\n});\n'''
              t.write_text(ts + '\n')
          PY

          grep -q 'function revealBeatRow(beatId)' raindesk/public/js/beats.js
          grep -q 'body.getBoundingClientRect()' raindesk/public/js/beats.js
          grep -q 'selected Beat reveal uses visible geometry' raindesk/tests/frontend/beats.test.js
          node --check raindesk/public/js/beats.js
          cd raindesk
          npm test

      - name: Promote source and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/director-loop-geometry-reveal-promote.yml
          git config user.name 'Raindesk CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'nothing to promote'; exit 1; }
          git commit -m 'raindesk: reveal selected Beat using visible geometry'
          git push origin HEAD:chatgpt/director-loop-v1

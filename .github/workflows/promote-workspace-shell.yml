name: Promote Floating Workspace Shell

on:
  push:
    branches:
      - 'chatgpt/endless-workspace-shell-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify tracked workspace payload
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "chatgpt/endless-workspace-shell-v1"
          test "$(find raindesk/dev/.workspace-shell-payload -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 6
          cat raindesk/dev/.workspace-shell-payload/part* > /tmp/workspace-tracked.b64
          echo '7f7a68d98e1e25f3a32233e7b9a951402fb0582a6d7907b1fe5890612e69c628  /tmp/workspace-tracked.b64' | sha256sum -c -
          base64 -d /tmp/workspace-tracked.b64 > /tmp/workspace-tracked.patch.bz2
          echo 'eda4c71c2379bf22f1c154c5b4cc6f03477f1485bcd537a52cf6e55fe2e2945a  /tmp/workspace-tracked.patch.bz2' | sha256sum -c -
          bzip2 -dc /tmp/workspace-tracked.patch.bz2 > /tmp/workspace-tracked.patch
          echo 'c607e233ebfffb78c212ae83848f6366c300bf96d804a8cf967d02d1a9333ab0  /tmp/workspace-tracked.patch' | sha256sum -c -

      - name: Reconstruct and verify new workspace files payload
        run: |
          set -euo pipefail
          test "$(find raindesk/dev/.workspace-shell-newfiles -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 7
          cat raindesk/dev/.workspace-shell-newfiles/part* > /tmp/workspace-new.b64
          echo '41f0c2f1c26b7ac1edfd38fd5e4454a95e96368ec589667de36f46afbed960ff  /tmp/workspace-new.b64' | sha256sum -c -
          base64 -d /tmp/workspace-new.b64 > /tmp/workspace-new.patch.bz2
          echo '77d7a94942de7c5d2e79bf97b4820e64e4387efc84a6affc4de8a4481d5022cc  /tmp/workspace-new.patch.bz2' | sha256sum -c -
          bzip2 -dc /tmp/workspace-new.patch.bz2 > /tmp/workspace-new.patch
          echo '4a8d91999ffcb26b2836f13b1b58742a021d027148e8403d02700af0057b02f6  /tmp/workspace-new.patch' | sha256sum -c -

      - name: Apply exact tested workspace source diff
        run: |
          set -euo pipefail
          git apply --check --directory=raindesk /tmp/workspace-tracked.patch
          git apply --directory=raindesk /tmp/workspace-tracked.patch
          git apply --check --directory=raindesk /tmp/workspace-new.patch
          git apply --directory=raindesk /tmp/workspace-new.patch
          test -f raindesk/public/js/workspace-ui.js
          test -f raindesk/dev/browser-workspace-smoke.js
          test -f raindesk/tests/frontend/workspace-ui.test.js
          test -f raindesk/WORKSPACE_SHELL.md

      - name: Syntax check workspace shell
        working-directory: raindesk
        run: |
          set -euo pipefail
          node --check public/js/workspace-ui.js
          node --check public/js/app.js
          node --check public/js/chat.js
          node --check lib/partner.js
          node --check lib/workspace.js
          node --check dev/browser-workspace-smoke.js

      - name: Run complete Raindesk suite before promotion
        working-directory: raindesk
        run: npm test

      - name: Promote real source and remove transport scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm raindesk/dev/.workspace-shell-payload.b64
          git rm -r raindesk/dev/.workspace-shell-payload
          git rm -r raindesk/dev/.workspace-shell-newfiles
          git rm .github/workflows/promote-workspace-shell.yml
          git add -A raindesk
          git diff --cached --check
          git commit -m 'raindesk: hydrate persistent floating creative workspace'
          git push origin HEAD:chatgpt/endless-workspace-shell-v1

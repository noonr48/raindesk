name: Direction Partner

on:
  push:
    branches:
      - 'chatgpt/direction-partner-v2'
  pull_request:
    paths:
      - 'raindesk/**'
      - '.github/workflows/direction-partner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: raindesk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/direction-partner-v2
          fetch-depth: 0

      - name: Reconstruct tested partner integration and apply direction slices
        run: |
          changed=0
          if ! node --check server.js >/dev/null 2>&1; then
            git show fb668ccb0f838dac90a3af68febc64c544fc3e6a:raindesk/server.js > server.js
            patch -p0 < dev/server-partner.patch
            node --check server.js
            changed=1
          fi
          if ! node --check lib/tests/routes.test.js >/dev/null 2>&1; then
            git show fb668ccb0f838dac90a3af68febc64c544fc3e6a:raindesk/lib/tests/routes.test.js > lib/tests/routes.test.js
            patch -p0 < dev/routes-partner.patch
            node --check lib/tests/routes.test.js
            changed=1
          fi

          if ! grep -q 'RaindeskDirection' public/js/app.js; then
            patch -p0 < dev/public-js-app-direction.patch
            changed=1
          fi
          if ! grep -q 'data-tool="direction"' public/index.html; then
            patch -p0 < dev/public-index-direction.patch
            changed=1
          fi
          if ! grep -q 'addPartnerNote' public/js/chat.js; then
            patch -p0 < dev/public-js-chat-direction.patch
            changed=1
          fi
          if ! grep -q 'direction-caption' public/css/app.css; then
            patch -p0 < dev/public-css-direction.patch
            changed=1
          fi

          if ! grep -q 'function ensureLegacyShot' lib/direction.js; then
            patch -p0 < dev/direction-legacy-capture.patch
            changed=1
          fi
          if ! grep -q 'function captureInterpretedBeat' lib/partner.js; then
            patch -p0 < dev/partner-auto-capture.patch
            changed=1
          fi
          if ! grep -q 'legacy shot bridge is idempotent' lib/tests/direction.test.js; then
            patch -p0 < dev/direction-test-auto-capture.patch
            changed=1
          fi
          if ! grep -q 'legacy storyboard chat is quietly bridged' lib/tests/partner.test.js; then
            patch -p0 < dev/partner-test-auto-capture.patch
            changed=1
          fi

          node --check lib/direction.js
          node --check lib/partner.js
          node --check public/js/app.js
          node --check public/js/chat.js
          node --check public/js/direction.js

          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server.js lib/tests/routes.test.js lib/direction.js lib/partner.js lib/tests/direction.test.js lib/tests/partner.test.js public/index.html public/js/app.js public/js/chat.js public/css/app.css
            git commit -m "raindesk: capture partner direction into shot beats"
            git push origin HEAD:chatgpt/direction-partner-v2
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check partner integration
        run: |
          node --check server.js
          node --check lib/direction.js
          node --check lib/workflow-router.js
          node --check lib/partner.js
          node --check lib/tests/routes.test.js
          node --check public/js/api.js
          node --check public/js/chat.js
          node --check public/js/direction.js
          node --check public/js/app.js

      - name: Run Raindesk tests
        run: npm test

      - name: Render desktop acceptance preview
        run: |
          set -e
          DATA_DIR="$(mktemp -d)"
          RAINDESK_DATA_DIR="$DATA_DIR" node server.js > /tmp/raindesk-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:17600/ >/dev/null; then break; fi
            sleep 0.1
          done
          BROWSER="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$BROWSER" ]; then
            echo "Chromium/Chrome not available" >&2
            exit 1
          fi
          mkdir -p artifacts/direction
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --run-all-compositor-stages-before-draw --virtual-time-budget=1800 \
            --window-size=1440,900 \
            --screenshot="$(pwd)/artifacts/direction/desktop-1440x900.png" \
            http://127.0.0.1:17600/

      - name: Upload UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raindesk-direction-preview
          path: raindesk/artifacts/direction/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raindesk-direction-source
          path: raindesk/
          retention-days: 1

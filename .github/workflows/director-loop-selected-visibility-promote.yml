name: Promote Selected Beat Immediate Visibility

on:
  push:
    branches:
      - 'chatgpt/director-loop-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact selected-Beat visibility change
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('raindesk/public/js/beats.js')
          s = p.read_text()
          old = '''      if (activeBeatId) {\n        requestAnimationFrame(() => {\n          const row = list.querySelector(`.beat-row[data-beat-id="${activeBeatId}"]`);\n          if (!row) return;\n          // Row + selected-detail are contiguous creative material. If they fit\n          // together, keep both visible. If not, prioritise the compact Beat\n          // row and its edit/reorder controls; the pose detail scrolls below.\n          const top = list.offsetTop + row.offsetTop;\n          const bottom = detail.classList.contains('open')\n            ? detail.offsetTop + detail.offsetHeight\n            : top + row.offsetHeight;\n          if (bottom - top <= body.clientHeight) {\n            if (top < body.scrollTop) body.scrollTop = top;\n            else if (bottom > body.scrollTop + body.clientHeight) {\n              body.scrollTop = Math.max(0, bottom - body.clientHeight);\n            }\n          } else {\n            body.scrollTop = Math.max(0, top);\n          }\n        });\n      }\n'''
          new = '''      if (activeBeatId) {\n        const row = list.querySelector(`.beat-row[data-beat-id="${activeBeatId}"]`);\n        if (row) {\n          // Establish selected-Beat visibility as part of the same render that\n          // publishes the row.  Do not defer this to requestAnimationFrame:\n          // callers should never observe a Beat in the DOM while its controls\n          // are still clipped waiting for a later paint.\n          const top = list.offsetTop + row.offsetTop;\n          const bottom = detail.classList.contains('open')\n            ? detail.offsetTop + detail.offsetHeight\n            : top + row.offsetHeight;\n          if (bottom - top <= body.clientHeight) {\n            if (top < body.scrollTop) body.scrollTop = top;\n            else if (bottom > body.scrollTop + body.clientHeight) {\n              body.scrollTop = Math.max(0, bottom - body.clientHeight);\n            }\n          } else {\n            body.scrollTop = Math.max(0, top);\n          }\n        }\n      }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one deferred visibility block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          grep -q 'Establish selected-Beat visibility as part of the same render' raindesk/public/js/beats.js
          node --check raindesk/public/js/beats.js
          cd raindesk
          npm test

      - name: Promote source and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/director-loop-selected-visibility-promote.yml
          git config user.name 'Raindesk CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'nothing to promote'; exit 1; }
          git commit -m 'raindesk: make selected Beat controls immediately usable'
          git push origin HEAD:chatgpt/director-loop-v1

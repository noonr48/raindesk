name: Promote Director Loop v1

on:
  push:
    branches:
      - 'chatgpt/director-loop-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify exact tested Director Loop payload
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "chatgpt/director-loop-v1"
          test "$(find raindesk/dev/.director-loop-payload -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 8
          cat raindesk/dev/.director-loop-payload/part* > /tmp/director-loop.b64
          echo '9d9dbbc3d254014a390bc2bde7e59b102785eaf1c14512296dd54bf6be375717  /tmp/director-loop.b64' | sha256sum -c -
          base64 -d /tmp/director-loop.b64 > /tmp/director-loop.patch.bz2
          echo '5b6ea5422718de8efbe9d82f98f852c6091486d0366ba1baa2f743412f0c2bcf  /tmp/director-loop.patch.bz2' | sha256sum -c -
          bzip2 -dc /tmp/director-loop.patch.bz2 > /tmp/director-loop.patch
          echo 'f1f43b2edb85445a9fcced30756d56da99d5cb2a50016390ad9d8197b6eeb925  /tmp/director-loop.patch' | sha256sum -c -

      - name: Apply exact tested Director Loop source diff
        run: |
          set -euo pipefail
          git apply --check --directory=raindesk /tmp/director-loop.patch
          git apply --directory=raindesk /tmp/director-loop.patch
          test -f raindesk/DIRECTOR_LOOP_V1.md
          test -f raindesk/dev/browser-director-loop-smoke.js
          test -f raindesk/tests/frontend/beats.test.js

      - name: Syntax check Director Loop surface
        working-directory: raindesk
        run: |
          set -euo pipefail
          node --check server.js
          node --check lib/direction.js
          node --check lib/partner.js
          node --check public/js/api.js
          node --check public/js/app.js
          node --check public/js/beats.js
          node --check public/js/direction.js
          node --check dev/browser-director-loop-smoke.js

      - name: Run complete Raindesk suite before promotion
        working-directory: raindesk
        run: npm test

      - name: Promote source and remove transport scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r raindesk/dev/.director-loop-payload
          git rm .github/workflows/director-loop-handoff.yml
          git add -A raindesk
          git diff --cached --check
          git commit -m 'raindesk: build Director Loop v1 directing semantics'
          git push origin HEAD:chatgpt/director-loop-v1

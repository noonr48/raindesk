name: Adapter Invocations v1

on:
  push:
    branches:
      - 'chatgpt/adapter-invocations-v1'
  pull_request:
    branches:
      - 'chatgpt/production-adapters-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-invocations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check invocation surface
        working-directory: raindesk
        run: |
          set -euo pipefail
          node --check lib/production-adapters.js
          node --check lib/capability-planner.js
          node --check lib/adapter-invocations.js
          node --check lib/partner-plan-core.js
          node --check lib/partner.js
          node --check lib/tests/adapter-invocations.test.js
          node --check lib/tests/adapter-invocations-partner.test.js

      - name: Run complete Raindesk deterministic suite
        working-directory: raindesk
        run: npm test

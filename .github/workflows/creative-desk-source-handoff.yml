name: Promote Creative Desk v1

on:
  push:
    branches:
      - 'chatgpt/creative-desk-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify exact tested Creative Desk payload
        run: |
          set -euo pipefail
          cat raindesk/dev/.creative-desk-payload/part00 \
              raindesk/dev/.creative-desk-payload/part01 \
              raindesk/dev/.creative-desk-payload/part02 \
              raindesk/dev/.creative-desk-payload/part03 \
              raindesk/dev/.creative-desk-payload/part04 > /tmp/creative-desk.b64
          echo '0f4996938dcc66876ef2cb7f54e9d459a802516bffba8be3a712edcf97565e5f  /tmp/creative-desk.b64' | sha256sum -c -
          base64 -d /tmp/creative-desk.b64 > /tmp/creative-desk.patch.bz2
          echo '60a4b28a14759b88a305d62282e83241ea21c2b505479ff57277da056bc1d0f8  /tmp/creative-desk.patch.bz2' | sha256sum -c -
          bzip2 -dc /tmp/creative-desk.patch.bz2 > /tmp/creative-desk.patch
          echo '7631f8df83ed2f6e9ce2ea22afe57df201a8cfb703f3cb46e5b45224fbd98ea9  /tmp/creative-desk.patch' | sha256sum -c -
          git apply --check /tmp/creative-desk.patch

      - name: Apply exact tested Creative Desk source
        run: |
          set -euo pipefail
          git apply /tmp/creative-desk.patch
          grep -q 'schemaVersion: 2' raindesk/lib/workspace.js
          grep -q 'space: .world.' raindesk/public/js/creative-desk.js
          grep -q 'id="creativeWorld"' raindesk/public/index.html
          grep -q 'kind: .pan.' raindesk/public/js/app.js
          node --check raindesk/lib/workspace.js
          node --check raindesk/public/js/creative-desk.js
          node --check raindesk/public/js/app.js
          node --check raindesk/dev/browser-creative-desk-smoke.js
          cd raindesk
          npm test

      - name: Promote source and remove transport scaffolding
        run: |
          set -euo pipefail
          rm -rf raindesk/dev/.creative-desk-payload
          rm -f .github/workflows/creative-desk-source-handoff.yml
          git config user.name 'Raindesk CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'nothing to promote'; exit 1; }
          git commit -m 'raindesk: add Creative Desk world-space foundation'
          git push origin HEAD:chatgpt/creative-desk-v1

name: Promote Artistic State Integrity

on:
  push:
    branches:
      - 'chatgpt/artistic-state-integrity-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify tested payload
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "chatgpt/artistic-state-integrity-v1"
          test "$(find raindesk/dev/.integrity-payload -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 8
          cat raindesk/dev/.integrity-payload/part* > /tmp/artistic-integrity.b64
          echo 'b3dcee997952e2619d0558e252ced0c8a7cc3191a34f7e711714a986b2d7fb9d  /tmp/artistic-integrity.b64' | sha256sum -c -
          base64 -d /tmp/artistic-integrity.b64 > /tmp/artistic-integrity.patch.bz2
          echo '090027468c5fd0f93e1357006b01f78b9d5f6c48fab9b73b4a15449b85a65569  /tmp/artistic-integrity.patch.bz2' | sha256sum -c -
          bzip2 -dc /tmp/artistic-integrity.patch.bz2 > /tmp/artistic-integrity.patch
          echo '0191d75a5e8a6235df6769f6c8741b776a1573e8f8bc488f1d818d140b4dcd98  /tmp/artistic-integrity.patch' | sha256sum -c -

      - name: Apply exact hardened source diff
        working-directory: raindesk
        run: |
          set -euo pipefail
          git apply --check /tmp/artistic-integrity.patch
          git apply /tmp/artistic-integrity.patch

      - name: Syntax check hardened substrate
        working-directory: raindesk
        run: |
          set -euo pipefail
          node --check server.js
          node --check lib/blobs.js
          node --check lib/shot-documents.js
          node --check lib/takes.js
          node --check lib/job-store.js
          node --check lib/workspace.js
          node --check lib/partner-actions.js
          node --check lib/partner-turns.js
          node --check lib/direction.js
          node --check lib/partner.js
          node --check lib/agent.js
          node --check public/js/canvas.js
          node --check public/js/api.js
          node --check public/js/app.js
          node --check dev/browser-integrity-smoke.js

      - name: Run complete Raindesk suite before promotion
        working-directory: raindesk
        run: npm test

      - name: Promote real source and remove transport scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r raindesk/dev/.integrity-payload
          git rm .github/workflows/promote-artistic-integrity.yml
          git add -A raindesk
          git diff --cached --check
          git commit -m 'raindesk: make artistic state non-destructive and revision-safe'
          git push origin HEAD:chatgpt/artistic-state-integrity-v1

name: Capability Planner v1

on:
  push:
    branches:
      - 'chatgpt/capability-planner-v1'
  pull_request:
    branches:
      - 'chatgpt/character-anchors-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check capability-planning surface
        working-directory: raindesk
        run: |
          set -euo pipefail
          node --check server.js
          node --check lib/partner.js
          node --check lib/capability-planner.js
          node --check lib/tests/capability-planner.test.js
          node --check lib/tests/capability-planner-partner.test.js

      - name: Run complete Raindesk deterministic suite
        working-directory: raindesk
        run: npm test
